[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socavacion-ll"
version = "0.5.0"
description = "Socavación general LL para secciones rectangulares e irregulares no cohesivas"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.2", "python-docx==1.2.0", "reportlab==5.0.1",
    "matplotlib==3.11.2", "openpyxl==3.1.5",
]

[project.optional-dependencies]
pruebas = ["pypdf==6.20.0"]
desarrollo = ["pypdf==6.20.0", "ruff==0.17.0", "mypy==2.4.0", "coverage==7.16.2", "pip-audit==2.10.1"]

[project.gui-scripts]
socavacion-ll = "socavacion_ll.__main__:principal"

[tool.setuptools.packages.find]
where = ["src"]

# Análisis básico sobre todo src; tipos estrictos solo en el núcleo puro.
[tool.ruff]
target-version = "py311"
cache-dir = "tmp/calidad/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/socavacion_ll/dominio", "src/socavacion_ll/calculo"]
strict = true
python_version = "3.11"
cache_dir = "tmp/calidad/mypy"

[tool.coverage.run]
branch = true
source = ["src/socavacion_ll/calculo", "src/socavacion_ll/dominio"]
data_file = "tmp/calidad/.coverage"
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.coverage.json]
output = "tmp/calidad/cobertura.json"
